<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Chandoul Mounib — Full-Stack Developer</title>
  <desc id="desc">Terminal-style developer banner with a live equalizer motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#14162a"/>
      <stop offset="100%" stop-color="#24263d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DCFFF"/>
      <stop offset="50%" stop-color="#BB9AF7"/>
      <stop offset="100%" stop-color="#9ECE6A"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#2b3050" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>

  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <text x="60" y="62" font-family="Courier New, monospace" font-size="16" fill="#9ECE6A">$ whoami</text>
  <rect x="145" y="48" width="11" height="17" fill="#7DCFFF">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="58" y="132" font-family="Courier New, monospace" font-size="52" font-weight="bold" letter-spacing="3" fill="#C0CAF5">CHANDOUL MOUNIB</text>
  <text x="60" y="172" font-family="Courier New, monospace" font-size="19" letter-spacing="1.5" fill="#7DCFFF">FULL-STACK DEVELOPER  ·  FLUTTER  ·  FASTAPI  ·  ML</text>
  <text x="60" y="206" font-family="Courier New, monospace" font-size="15" fill="#7982A9">Tunisia  ·  ISD @ ISET Radès  ·  open to work</text>
  <text x="60" y="246" font-family="Courier New, monospace" font-size="14" fill="#BB9AF7">&gt; building useful things, one commit at a time_</text>

  <g transform="translate(820,54)">
    <rect x="0" y="0" width="320" height="172" rx="10" fill="#1A1B2E" stroke="#3B3F5C" stroke-width="3"/>
    <rect x="18" y="18" width="284" height="20" rx="4" fill="#24263D"/>
    <circle cx="32" cy="28" r="5" fill="#F7768E"/>
    <circle cx="50" cy="28" r="5" fill="#E0AF68"/>
    <circle cx="68" cy="28" r="5" fill="#9ECE6A"/>
    <text x="92" y="32" font-family="Courier New, monospace" font-size="11" fill="#7982A9">signal.monitor</text>

    <g transform="translate(18,52)">
      <rect x="0"   y="46" width="12" height="56" fill="#7DCFFF"/>
      <rect x="19"  y="30" width="12" height="72" fill="#BB9AF7"/>
      <rect x="38"  y="58" width="12" height="44" fill="#9ECE6A"/>
      <rect x="57"  y="18" width="12" height="84" fill="#E0AF68"/>
      <rect x="76"  y="38" width="12" height="64" fill="#F7768E"/>
      <rect x="95"  y="8"  width="12" height="94" fill="#7AA2F7"/>
      <rect x="114" y="50" width="12" height="52" fill="#7DCFFF"/>
      <rect x="133" y="26" width="12" height="76" fill="#BB9AF7"/>
      <rect x="152" y="62" width="12" height="40" fill="#9ECE6A"/>
      <rect x="171" y="34" width="12" height="68" fill="#E0AF68"/>
      <rect x="190" y="14" width="12" height="88" fill="#F7768E"/>
      <rect x="209" y="44" width="12" height="58" fill="#7AA2F7"/>
      <rect x="228" y="24" width="12" height="78" fill="#7DCFFF"/>
      <rect x="247" y="54" width="12" height="48" fill="#BB9AF7"/>
      <rect x="266" y="36" width="12" height="66" fill="#9ECE6A"/>
    </g>
    <text x="18" y="157" font-family="Courier New, monospace" font-size="11" fill="#7982A9">ship  ·  learn  ·  repeat</text>
  </g>

  <rect x="0" y="274" width="1200" height="6" fill="url(#accent)"/>
</svg>
